<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealCode | Members</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        :root { --primary: #00b894; --secondary: #0984e3; --dark: #2d3436; --light: #f9f9f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; line-height: 1.6; color: var(--dark); background-color: var(--light); display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        nav { background: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        .nav-links a { margin-left: 2rem; font-weight: 600; color: #636e72; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }

        section { padding: 60px 10%; max-width: 900px; margin: 40px auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); flex: 1; }
        .section-title { text-align: center; margin-bottom: 40px; }
        .section-title h2 { font-size: 2rem; margin-bottom: 10px; }

        .member-list { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; }
        .member-tag { padding: 10px 20px; background: var(--light); border: 1px solid #ddd; border-radius: 50px; font-weight: 600; font-size: 1.1rem; }
        .member-tag.diamond { border-color: #00cec9; color: #00cec9; background: #e0ffff; }
        
        footer { background: var(--dark); color: white; padding: 30px 10%; text-align: center; margin-top: auto; }
    </style>
</head>
<body>

  <nav>
        <div class="logo">HealCode</div>
        <div class="nav-links">
            <a href="index.html">About</a>
            <a href="tiers.html">Tier System</a>
            <a href="members.html" class="active">Members</a>
            <a href="join.html">Join Us</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>

    <section>
        <div class="section-title">
            <h2>HealCoders</h2>
            <p>HealCode를 함께 만들어가는 열정적인 멤버들입니다.</p>
        </div>
        <div class="member-list">
            <div class="member-tag diamond">💎 김철수(대표)</div>
            <div class="member-tag">🍃 이영희</div>
            <div class="member-tag">🔑 박지민</div>
            <div class="member-tag">🥈 최현우</div>
            <div class="member-tag">🥈 정다은</div>
            <div class="member-tag">🥉 강호진</div>
            <div class="member-tag">🥉 유재석</div>
            <div class="member-tag">🥉 신사임당</div>
            <div class="member-tag">🥶 홍길동</div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 HealCode. All rights reserved.</p>
    </footer>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리 단체 웹페이지</title>
    <style>
        /* 여기서부터 웹페이지의 디자인(인테리어)을 담당합니다 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

        body {
            font-family: 'Pretendard', sans-serif;
            background-color: #f4f7f6; /* 페이지 전체 배경색 (연한 회색) */
            color: #333;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: white; /* 내용이 들어가는 박스 색상 */
            max-width: 600px;
            width: 100%;
            border-radius: 15px; /* 박스 모서리 둥글게 */
            padding: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05); /* 박스 그림자 */
        }
        h1 {
            color: #2c3e50; /* 제목 색상 */
            text-align: center;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        h2 {
            color: #3498db; /* 소제목 색상 (파란색) */
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
            margin-top: 30px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #f8f9fa;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #3498db; /* 리스트 왼쪽 파란색 포인트 줄 */
        }
        .contact li {
            border-left: none;
            background-color: transparent;
            padding: 5px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 [단체 이름]</h1>
    <p class="subtitle">우리 단체를 소개하는 공식 웹페이지입니다.</p>

    <h2>✨ 주요 활동</h2>
    <ul>
        <li><strong>정기 모임:</strong> 매주 모여서 스터디 진행</li>
        <li><strong>프로젝트:</strong> 학기말 프로젝트 발표</li>
        <li><strong>네트워킹:</strong> 친목 도모를 위한 워크샵</li>
    </ul>

    <h2>👥 구성원</h2>
    <ul>
        <li><strong>홍길동</strong> - 대표 (전체 운영 총괄)</li>
        <li><strong>김철수</strong> - 기획 (프로젝트 기획 및 관리)</li>
        <li><strong>이영희</strong> - 홍보 (웹사이트 관리 및 디자인)</li>
    </ul>

    <h2>📞 연락처</h2>
    <ul class="contact">
        <li>📧 이메일: contact@ourclub.com</li>
        <li>📱 인스타그램: @ourclub_official</li>
    </ul>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HealCode | Contact</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #00b894; --secondary: #0984e3; --dark: #2d3436; --light: #f9f9f9; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Pretendard', sans-serif; line-height: 1.6; color: var(--dark); background-color: var(--light); display: flex; flex-direction: column; min-height: 100vh; }
        a { text-decoration: none; color: inherit; }

        /* 영어로 바뀐 공통 네비게이션 */
        nav { background: white; padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; }
        .logo { font-size: 1.5rem; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        .nav-links a { margin-left: 2rem; font-weight: 600; color: #636e72; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--primary); }
        
        footer { background: var(--dark); color: white; padding: 30px 10%; text-align: center; margin-top: auto; }

        /* Contact 섹션 디자인 */
        section { padding: 80px 10%; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .contact-card { background: white; padding: 50px; border-radius: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); text-align: center; max-width: 600px; width: 100%; border-top: 5px solid var(--secondary); }
        .contact-card h2 { font-size: 2.5rem; margin-bottom: 10px; color: var(--dark); }
        .contact-card p { color: #636e72; margin-bottom: 40px; font-size: 1.1rem; }

        .contact-methods { display: flex; flex-direction: column; gap: 20px; }
        .method { display: flex; align-items: center; justify-content: center; gap: 15px; padding: 20px; background: var(--light); border-radius: 15px; transition: 0.3s; font-size: 1.2rem; font-weight: 600; }
        .method:hover { background: #e0ffff; transform: translateY(-3px); }
        .method i { font-size: 1.8rem; color: var(--primary); }
    </style>
</head>
<body>

  <nav>
        <div class="logo">HealCode</div>
        <div class="nav-links">
            <a href="index.html">About</a>
            <a href="tiers.html">Tier System</a>
            <a href="members.html">Members</a>
            <a href="join.html">Join Us</a>
            <a href="contact.html" class="active">Contact</a>
        </div>
    </nav>

    <section>
        <div class="contact-card">
            <h2>Get in Touch</h2>
            <p>의료의 미래를 함께 코딩할 여러분을 기다립니다.<br>궁금한 점이 있다면 언제든 연락해 주세요!</p>
            
            <div class="contact-methods">
                <a href="https://instagram.com/여기에아이디입력" target="_blank" class="method">
                    <i class="fa-brands fa-instagram"></i>
                    <span>@healcode_official</span>
                </a>
                
                <a href="mailto:contact@healcode.com" class="method">
                    <i class="fa-solid fa-envelope"></i>
                    <span>contact@healcode.com</span>
                </a>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2024 HealCode. All rights reserved.</p>
    </footer>

</body>
</html>
